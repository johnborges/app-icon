name: AI-66 emulator evidence

on:
  push:
    branches:
      - fix/ai-66-change-no-kill

permissions:
  contents: read
  actions: write

jobs:
  emulator:
    name: API 34 ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, fix]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Use upstream AppIconBase.java for baseline
        if: matrix.variant == 'baseline'
        run: |
          git fetch --depth=1 origin 4fd15a83ec4aeccc35943e9f7d30b5b0521f0851
          git show 4fd15a83ec4aeccc35943e9f7d30b5b0521f0851:android/src/main/java/com/mycompany/plugins/example/AppIconBase.java \
            > android/src/main/java/com/mycompany/plugins/example/AppIconBase.java
          grep -q "Always disable main app icon" android/src/main/java/com/mycompany/plugins/example/AppIconBase.java

      - name: Confirm fix sources
        if: matrix.variant == 'fix'
        run: |
          grep -q "relaunched component" android/src/main/java/com/mycompany/plugins/example/AppIconBase.java
          grep -q '<!-- <category android:name="android.intent.category.LAUNCHER" /> -->' example/android/app/src/main/AndroidManifest.xml

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Set up Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: 21

      - name: Build the plugin and example web app
        run: |
          npm ci
          npm run build
          cd example
          npm ci
          npm run build
          npx cap sync android

      - name: Confirm the documented launcher manifest
        run: |
          grep -n "LAUNCHER" example/android/app/src/main/AndroidManifest.xml
          grep -q '<!-- <category android:name="android.intent.category.LAUNCHER" /> -->' example/android/app/src/main/AndroidManifest.xml

      - name: Build the debug APK
        run: |
          cd example/android
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Allow the runner to use KVM
        run: |
          ls -l /dev/kvm || true
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Run the evidence script on an emulator
        continue-on-error: ${{ matrix.variant == 'baseline' }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          AI66_VARIANT: ${{ matrix.variant }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "$GITHUB_WORKSPACE/.github/scripts/ai66-collect.sh"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai66-evidence-${{ matrix.variant }}
          if-no-files-found: warn
          path: ai66-evidence/
